name: Build LumaBar

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install make ldid dpkg xz

      - name: Install Theos and SDKs
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$HOME/theos"
          git clone --depth=1 https://github.com/theos/sdks.git "$HOME/theos/sdks"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"
          # Theos needs GNU make 4+, not Apple's make 3.81
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Build
        run: make package FINALPACKAGE=1

      - name: Inspect package
        run: |
          deb=$(ls packages/*.deb | head -n1)
          echo "== control =="; dpkg-deb -f "$deb"
          echo "== files =="; dpkg-deb -c "$deb"
          # Rootless packages must install under /var/jb
          dpkg-deb -c "$deb" | grep -q "/var/jb/" || { echo "not rootless"; exit 1; }
          dpkg-deb -f "$deb" Architecture | grep -qx "iphoneos-arm64" \
            || { echo "unexpected architecture"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: LumaBar-deb
          path: packages/*.deb
          if-no-files-found: error

  release:
    # Runs only when you push a tag like v0.2.0
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LumaBar-deb
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.deb"
          generate_release_notes: true
